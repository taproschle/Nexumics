services:
  postgres:
    image: postgres:16
    container_name: nexumics-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexumics}
      POSTGRES_USER: ${POSTGRES_USER:-nexumics}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexumics}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexumics} -d ${POSTGRES_DB:-nexumics}"]
      interval: 5s
      timeout: 5s
      retries: 10

  metabase:
    image: metabase/metabase:latest
    container_name: nexumics-metabase
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${METABASE_PORT:-3001}:3000"
    volumes:
      - metabase_data:/metabase-data
    environment:
      MB_DB_FILE: /metabase-data/metabase.db

volumes:
  postgres_data:
  metabase_data:
