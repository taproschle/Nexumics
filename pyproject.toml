[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexumics"
version = "0.1.0"
description = "Data engineering pipeline for public omics metadata."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.0"]

[project.scripts]
nexumics-sra-discovery = "nexumics.cli.sra_discovery:main"
nexumics-build-sra-local-lake = "nexumics.cli.build_sra_local_lake:main"
nexumics-validate-sra-lake = "nexumics.cli.validate_sra_lake:main"
nexumics-combine-sra-bronze = "nexumics.cli.combine_sra_bronze:main"
nexumics-build-sra-silver = "nexumics.cli.build_sra_silver:main"
nexumics-build-sra-gold = "nexumics.cli.build_sra_gold:main"
nexumics-export-sra-silver-parquet = "nexumics.cli.export_sra_silver_parquet:main"
nexumics-summarize-sra-silver = "nexumics.cli.summarize_sra_silver:main"
nexumics-sra-batch-ingest = "nexumics.cli.sra_batch_ingest:main"
nexumics-profile-sra-attributes = "nexumics.cli.profile_sra_attributes:main"

[tool.setuptools.packages.find]
where = ["src"]
