[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexumics"
version = "0.1.0"
description = "Data engineering pipeline for public omics metadata."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
nexumics-sra-discovery = "nexumics.cli.sra_discovery:main"

[tool.setuptools.packages.find]
where = ["src"]
